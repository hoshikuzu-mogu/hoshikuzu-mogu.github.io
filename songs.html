<style>

  .win__btns i{width:17px;height:15px;display:grid;place-items:center;background:var(--ice);border:1px solid var(--frame);font-style:normal;font-family:var(--px);font-size:14px;line-height:1;color:var(--blue-d)}

  .modes button{flex:1}
  .modes button[aria-pressed="true"],.kana button[aria-pressed="true"],.tags button[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue-d)}
  .search{position:relative}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--sub)}
  .search input{width:100%;height:44px;padding:0 12px 0 36px;border:1.5px solid var(--frame);border-radius:0;background:var(--ice);font-size:16px;-webkit-appearance:none;appearance:none}

  .note{font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between}
  .kana,.tags{display:flex;flex-wrap:wrap;gap:6px}
  .kana button{height:30px;padding:0 9px;font-size:12px}
  .selects{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}

  .rand__b{height:42px;padding:0 18px;background:var(--blue);color:#fff;border-radius:6px;box-shadow:0 4px 0 var(--blue-d);font-family:var(--dot);font-size:14px;letter-spacing:.08em}

  .rand__b:disabled{opacity:.5;cursor:default}
  .picked{padding:12px;border:1.5px dashed var(--blue);background:var(--pink2);display:grid;gap:2px}
  .picked span{font-size:12px;color:var(--sub)}
  .picked strong{font-size:16px;line-height:1.5}
  .picked .a{font-size:12px;color:var(--sub)}
  .picked .req{justify-self:start;margin-top:6px}
  .count{padding:8px 12px;font-family:var(--px);font-size:19px;color:var(--sub);border-bottom:1px solid var(--line)}

  /* リスト */
  .list{list-style:none}
  .list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}

  .list .t{display:block;font-weight:700;font-size:14px;line-height:1.5;word-break:break-word}
  .list .a{display:block;font-size:11px;color:var(--sub);word-break:break-word}
  .list .m{display:block;font-size:10.5px;color:var(--blue-d);margin-top:2px}

  .toast a{display:inline-block;margin-top:4px;margin-right:12px;color:var(--blue);text-decoration:underline}

  .upd small{display:block;font-size:11px;opacity:.85}

<header class="header">

        <label for="genre">ジャンル</label>

      </div>
      <div class="rand">
        <button class="rand__b" id="rand" type="button" disabled>おまかせで1曲 ♡</button>
        <div class="picked" id="picked" role="status" hidden></div>
      </div>
    </div>
    <p class="count" id="count" aria-live="polite">読み込み中…</p>
    <ul class="list" id="list"></ul>
    <button class="more" id="more" type="button" hidden>もっと見る</button>
  </div>
</main>
<footer class="foot">星屑もぐの歌える曲リスト ♡</footer>

<button class="upd" id="upd" type="button" hidden>新しいバージョンがあるよ<small>タップして更新</small></button>

  function copyText(txt){

    });
  }

    $('kana').appendChild(b);
  });
  $('rand').addEventListener('click',function(){
    var hits=filtered(); if(!hits.length) return;
    var s=hits[Math.floor(Math.random()*hits.length)], box=$('picked');
    box.innerHTML='<span>この曲はいかが？ ♡</span><strong>'+esc(s.title)+'</strong>'+(s.artist?'<span class="a">'+esc(s.artist)+'</span>':'')+'<button class="req" type="button">リクエストをコピー</button>';
    var b=box.querySelector('button'); b.dataset.l='リクエストをコピー';
    b.addEventListener('click',function(){pick(s,this);}); box.hidden=false;
  });
  $('more').addEventListener('click',function(){shown+=STEP; render();});
  $('share').addEventListener('click',function(){
    var url=location.origin+location.pathname;
    function sc(){copyText(url).then(function(){toast('<b>曲リストのURLをコピーしたよ！</b>リスナーさんに送ってね♡');}).catch(function(){toast('<b>曲リストのURL</b>'+esc(url));});}
    if(navigator.share){navigator.share({title:'星屑もぐの歌える曲リスト',text:'歌のリクエストはこちらから ♡',url:url}).catch(function(e){if(e.name!=='AbortError') sc();});}
    else sc();
  });

  // ---- 読み込み ----
  function fetchJson(url,opt){
    var ctl=window.AbortController?new AbortController():null, tm=ctl?setTimeout(function(){ctl.abort();},10000):0;
    opt=opt||{}; opt.signal=ctl?ctl.signal:undefined;
    return fetch(url,opt).then(function(r){clearTimeout(tm); if(!r.ok) throw new Error(r.status); return r.json();});
  }
  function viaSupabase(){
    return fetchJson(SB+'mogu_songs_list',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:'{}'}).then(fromSupabase).catch(function(){return [];});
  }
  function start(list){
    songs=dedupe(list||[]); enrich(); tagsUI(); render();
    if(songs.length) loadMaster();
  }
  // 管理画面の「歌える曲」が元データ。まだ空のときだけ、最初に入れた曲リスト(SNAP)を出す
  viaSupabase().then(function(l){ start(l&&l.length?l:fromSnap()); });

  // ---- 新しい版のお知らせ ----
  (function(){
    var meta=document.querySelector('meta[name="build"]'), mine=meta&&meta.content, el=$('upd'), done=false; if(!mine) return;
    function check(){
      if(done||document.visibilityState==='hidden') return;
      fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(v){
        var latest=v&&v.pages&&v.pages['songs.html']; if(latest&&latest!==mine){done=true; el.hidden=false; requestAnimationFrame(function(){el.classList.add('is-show');});}
      }).catch(function(){});
    }
    el.addEventListener('click',function(){
      el.querySelector('small').textContent='更新しています…';
      var go=function(){location.reload();};
      if('caches' in window){caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}).then(go,go);}else go();
    });
    setTimeout(check,1500);
    document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible') check();});
  })();
})();
</script>
</body>
</html>
