<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#AFCBE8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="もぐ管理">
<title>もぐ管理</title>
<style>
  :root {
    --sky-top:#AFCBE8; --sky:#95B0E4; --lilac:#BCAAD8; --peri:#6F7FEA;
    --ink:#1F2456; --sub:#3F4880; --white:#fff; --rule:rgba(255,255,255,.6); --err:#B3264A;
    --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    --maru:"Hiragino Maru Gothic ProN","Zen Maru Gothic",var(--sans);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    color-scheme:light;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:linear-gradient(180deg,var(--sky-top),var(--sky) 60%,var(--lilac));background-color:var(--sky);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased}
  main{width:min(520px,100% - 40px);margin-inline:auto;padding-block:40px 64px}
  h1{font-family:var(--maru);font-weight:700;font-size:22px;letter-spacing:.08em;color:var(--white)}
  h1 small{display:block;font-size:12px;font-weight:500;letter-spacing:.12em;color:var(--sub);margin-top:2px}
  .card{margin-top:28px}
  label{display:block;font-family:var(--maru);font-weight:700;font-size:14px;letter-spacing:.08em;margin-bottom:8px}
  input{width:100%;height:52px;padding:0 14px;border:1.5px solid var(--peri);border-radius:8px;background:rgba(255,255,255,.9);font-size:16px;color:var(--ink);font-family:var(--sans)}
  input:focus{outline:2px solid var(--white);outline-offset:2px}
  .row{display:flex;gap:10px;margin-top:12px}
  button{font-family:var(--maru);font-weight:700;font-size:15px;letter-spacing:.1em;height:52px;border-radius:8px;cursor:pointer;border:1.5px solid var(--peri)}
  .primary{flex:1;background:var(--white);color:var(--ink);box-shadow:4px 4px 0 var(--peri);transition:transform .12s,box-shadow .12s}
  .primary:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--peri)}
  .primary:disabled{opacity:.5}
  .ghost{background:transparent;color:var(--ink);padding:0 16px}
  .msg{margin-top:14px;min-height:1.7em;font-size:14px;font-weight:600}
  .msg.err{color:var(--err)}
  h2{margin-top:44px;font-family:var(--maru);font-weight:700;font-size:15px;letter-spacing:.1em;color:var(--sub)}
  ul{list-style:none;margin-top:10px}
  li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule);font-size:14px}
  li:first-child{border-top:1px solid var(--rule)}
  li a{color:var(--ink);word-break:break-all}
  li small{display:block;color:var(--sub);font-size:12px}
  .del{height:36px;padding:0 14px;font-size:13px;background:transparent;color:var(--ink)}
  .empty{padding:14px 0;font-size:14px;color:var(--sub)}
  .foot{margin-top:40px;display:flex;justify-content:space-between;font-size:12px}
  .foot a,.foot button{color:var(--sub);background:none;border:0;height:auto;font:inherit;letter-spacing:.06em;text-decoration:underline;cursor:pointer}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>もぐ管理<small>サイトにXのポストを載せる</small></h1>

  <section id="keyView" class="card" hidden>
    <label for="key">はじめに鍵を貼ってください</label>
    <input id="key" type="password" autocomplete="off" placeholder="github_pat_…">
    <div class="row"><button class="primary" id="saveKey">この鍵で始める</button></div>
    <p class="msg" id="keyMsg"></p>
  </section>

  <section id="mainView" hidden>
    <div class="card">
      <label for="url">載せたいポストのリンク</label>
      <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://x.com/…/status/…">
      <div class="row">
        <button class="ghost" id="paste" type="button">貼り付け</button>
        <button class="primary" id="add">載せる</button>
      </div>
      <p class="msg" id="msg"></p>
    </div>

    <h2>いま載っているポスト（上から表示・最大5件）</h2>
    <ul id="list"><li class="empty">読み込み中…</li></ul>

    <div class="foot">
      <a href="../" target="_blank" rel="noopener">サイトを見る</a>
      <button id="resetKey" type="button">鍵を入れ直す</button>
    </div>
  </section>
</main>
<script>
(function(){
  var OWNER='hoshikuzu-mogu', REPO='hoshikuzu-mogu.github.io', PATH='posts.json', BRANCH='main';
  var API='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+PATH;
  var KEY='mogu_admin_key';
  var $=function(id){return document.getElementById(id);};
  var state={posts:[],sha:null};

  function getKey(){ try{return localStorage.getItem(KEY)||'';}catch(e){return '';} }
  function setKey(v){ try{ v?localStorage.setItem(KEY,v):localStorage.removeItem(KEY);}catch(e){} }
  function headers(){ return {'Authorization':'Bearer '+getKey(),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; }
  function b64decode(b){ var bin=atob(b.replace(/\n/g,'')); var u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return new TextDecoder().decode(u); }
  function b64encode(str){ var u=new TextEncoder().encode(str), bin=''; for(var i=0;i<u.length;i++)bin+=String.fromCharCode(u[i]); return btoa(bin); }
  function say(el,text,err){ el.textContent=text; el.classList.toggle('err',!!err); }
  function normalize(u){
    var m=String(u).trim().match(/^https?:\/\/(?:www\.|mobile\.)?(?:x|twitter)\.com\/([A-Za-z0-9_]+)\/status(?:es)?\/(\d+)/);
    return m ? 'https://x.com/'+m[1]+'/status/'+m[2] : null;
  }

  function load(){
    return fetch(API+'?ref='+BRANCH+'&t='+Date.now(),{headers:headers(),cache:'no-store'}).then(function(r){
      if(r.status===401||r.status===403) throw new Error('key');
      if(r.status===404){ state={posts:[],sha:null}; return; }
      if(!r.ok) throw new Error('net');
      return r.json().then(function(d){ var j={}; try{j=JSON.parse(b64decode(d.content));}catch(e){} state={posts:j.posts||[],sha:d.sha}; });
    });
  }
  function save(posts,message){
    var body={message:message,content:b64encode(JSON.stringify({posts:posts},null,2)+'\n'),branch:BRANCH};
    if(state.sha) body.sha=state.sha;
    return fetch(API,{method:'PUT',headers:headers(),body:JSON.stringify(body)}).then(function(r){
      if(r.status===409||r.status===422) throw new Error('conflict');
      if(r.status===401||r.status===403) throw new Error('key');
      if(!r.ok) throw new Error('net');
      return r.json().then(function(d){ state={posts:posts,sha:d.content.sha}; });
    });
  }
  function errText(e){
    return e.message==='key' ? '鍵が使えないみたい。「鍵を入れ直す」から貼り直してね'
         : e.message==='conflict' ? 'ほかの変更とぶつかったので、もう一度押してね'
         : '通信できなかったみたい。電波を確認してもう一度押してね';
  }

  function render(){
    var ul=$('list'); ul.innerHTML='';
    if(!state.posts.length){ ul.innerHTML='<li class="empty">まだ何も載っていません</li>'; return; }
    state.posts.forEach(function(p,i){
      var li=document.createElement('li');
      var d=p.added?new Date(p.added):null;
      var left=document.createElement('div');
      var a=document.createElement('a'); a.href=p.url; a.target='_blank'; a.rel='noopener'; a.textContent=p.url.replace('https://x.com/','');
      var sm=document.createElement('small'); sm.textContent=(i<5?'表示中':'表示されていません')+(d?'・'+(d.getMonth()+1)+'/'+d.getDate()+'に追加':'');
      left.appendChild(a); left.appendChild(sm);
      var b=document.createElement('button'); b.className='del'; b.textContent='消す';
      b.onclick=function(){ if(!confirm('このポストをサイトから外す？'))return; b.disabled=true;
        load().then(function(){ var next=state.posts.filter(function(x){return x.url!==p.url;}); return save(next,'ポストを外す'); })
          .then(function(){ render(); say($('msg'),'外しました。1分ほどでサイトに反映されます'); })
          .catch(function(e){ b.disabled=false; say($('msg'),errText(e),true); });
      };
      li.appendChild(left); li.appendChild(b); ul.appendChild(li);
    });
  }

  function start(){
    $('keyView').hidden=true; $('mainView').hidden=false;
    load().then(render).catch(function(e){ if(e.message==='key'){ showKey('鍵が使えないみたい。もう一度貼ってね'); } else { $('list').innerHTML='<li class="empty">読み込めませんでした</li>'; say($('msg'),errText(e),true); } });
  }
  function showKey(t){ $('mainView').hidden=true; $('keyView').hidden=false; say($('keyMsg'),t||'',!!t); }

  $('saveKey').onclick=function(){ var v=$('key').value.trim(); if(!v){say($('keyMsg'),'鍵が空っぽです',true);return;} setKey(v); $('key').value=''; start(); };
  $('resetKey').onclick=function(){ setKey(''); showKey(''); };
  $('paste').onclick=function(){
    if(navigator.clipboard&&navigator.clipboard.readText){ navigator.clipboard.readText().then(function(t){ $('url').value=t.trim(); }).catch(function(){ say($('msg'),'長押しで貼り付けてね',true); }); }
    else say($('msg'),'長押しで貼り付けてね',true);
  };
  $('add').onclick=function(){
    var url=normalize($('url').value);
    if(!url){ say($('msg'),'Xのポストのリンクを貼ってね（…/status/… の形）',true); return; }
    var btn=$('add'); btn.disabled=true; say($('msg'),'載せています…');
    load().then(function(){
      if(state.posts.some(function(p){return p.url===url;})) throw new Error('dup');
      var next=[{url:url,added:new Date().toISOString()}].concat(state.posts).slice(0,20);
      return save(next,'ポストを載せる');
    }).then(function(){ $('url').value=''; render(); say($('msg'),'載せました！1分ほどでサイトに出ます'); })
      .catch(function(e){ say($('msg'), e.message==='dup'?'そのポストはもう載っています':errText(e), true); })
      .then(function(){ btn.disabled=false; });
  };

  getKey() ? start() : showKey('');
})();
</script>
</body>
</html>
